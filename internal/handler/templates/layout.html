{{define "pageHead"}}
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f5f">
  <title>{{.Title}} · Orecon Putra Perkasa</title>
  <link rel="icon" href="/static/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/img/opp-logo.png">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{{end}}

{{define "pageFoot"}}
</body>
</html>
{{end}}

{{define "brandLogo"}}
<img class="brand-logo" src="/static/img/opp-logo.png" width="486" height="440" alt="Logo Orecon Putra Perkasa">
{{end}}

{{/* passwordToggle takes the id of the password input it controls. */}}
{{define "passwordToggle"}}
<button class="input-action" type="button" data-password-toggle="{{.}}" aria-controls="{{.}}" aria-pressed="false" aria-label="Tampilkan password" title="Tampilkan password">
  <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </svg>
  <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
    <path d="M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"></path>
    <path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.2-.9"></path>
    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
    <path d="m3 3 18 18"></path>
  </svg>
</button>
{{end}}

{{define "authTabs"}}
<nav class="auth-tabs" aria-label="Autentikasi">
  <a class="auth-tab {{if eq .ActiveTab "login"}}active{{end}}" href="/login">Masuk</a>
  <a class="auth-tab {{if eq .ActiveTab "register"}}active{{end}}" href="/register">Daftar</a>
</nav>
{{end}}
